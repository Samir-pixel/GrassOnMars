services:
  db:
    image: postgis/postgis:16-3.4
    container_name: marswalk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marswalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marswalk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-marswalk}
    ports:
      - "${POSTGRES_PORT:-4782}:5432"
    volumes:
      - marswalk_pgdata:/var/lib/postgresql/data
      - ./scripts/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-marswalk} -d $${POSTGRES_DB:-marswalk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marswalk-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-4780},http://127.0.0.1:${FRONTEND_PORT:-4780},https://grassonmars.myspaceproject.app
    ports:
      - "${BACKEND_PORT:-4781}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marswalk-frontend
    restart: unless-stopped
    environment:
      VITE_HOST: 0.0.0.0
      # Inside the container Vite still listens on 5173; the host publishes FRONTEND_PORT (default 4780).
      FRONTEND_PORT: "5173"
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-4780}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  marswalk_pgdata:
