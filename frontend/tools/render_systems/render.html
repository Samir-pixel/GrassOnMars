<!doctype html><html><head><style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./build/three.module.js","three/addons/":"./examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const files = (q.get('m')||'').split(',').filter(Boolean), az = +(q.get('az')||35), el = +(q.get('el')||18), W=+(q.get('w')||900), H=+(q.get('h')||700), fill=+(q.get('fill')||0.9);
const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
r.setSize(W,H); r.setClearColor(0x000000,0); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = +(q.get('exp')||1.0);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(5,8,6); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0x553322, 0.6));
const dl = new DRACOLoader(); dl.setDecoderPath('./examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader(); loader.setDRACOLoader(dl);
const group = new THREE.Group(); scene.add(group);
let i = 0;
if (q.get('sphere')) {
  const tl = new THREE.TextureLoader();
  const map = await tl.loadAsync('models/'+q.get('sphere')); map.colorSpace = THREE.SRGBColorSpace;
  const nm = q.get('normal') ? await tl.loadAsync('models/'+q.get('normal')) : null;
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), new THREE.MeshStandardMaterial({ map, normalMap: nm, roughness: 1, metalness: 0 }));
  m.rotation.y = +(q.get('lon')||0) * Math.PI/180; m.rotation.x = 0.35;
  group.add(m);
}
for (const f of (q.get('sphere') ? [] : files)) {
  const g = await loader.loadAsync('models/'+f);
  const o = g.scene;
  if (files.length>1) o.position.x = (i - (files.length-1)/2) * +(q.get('gap')||0);
  group.add(o); i++;
}
group.rotation.y = +(q.get('ry')||0) * Math.PI/180;
const box = new THREE.Box3().setFromObject(group); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3());
group.position.sub(c);
const cam = new THREE.PerspectiveCamera(28, W/H, 0.01, 1e6);
const R = s.length()/2;
const d = R / Math.sin(THREE.MathUtils.degToRad(28/2)) * (1/fill) * 0.62;
const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
cam.position.set(d*Math.cos(e)*Math.sin(a), d*Math.sin(e), d*Math.cos(e)*Math.cos(a)); cam.lookAt(0,0,0);
cam.near = d/100; cam.far = d*10; cam.updateProjectionMatrix();
r.render(scene, cam);
window.done = {size:[s.x,s.y,s.z]};
</script></body></html>
